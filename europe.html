<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Europe | Travel With Fahad</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:white;
}

header{
background:#0a0a0a;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
border-bottom:1px solid #222;
}

header span{
color:#00d4ff;
}

.hero{
height:350px;
background:url("Paris.jpg.jpg");
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
}

.hero h1{
font-size:55px;
background:rgba(0,0,0,.7);
padding:15px 30px;
border-radius:15px;
}

.content{
padding:50px 20px;
text-align:center;
}

.content p{
max-width:800px;
margin:auto;
color:#bbb;
line-height:1.8;
font-size:18px;
}

.btn{
display:inline-block;
margin-top:25px;
padding:12px 30px;
background:#00d4ff;
color:black;
text-decoration:none;
border-radius:8px;
font-weight:bold;
}

.destinations{
padding:40px 20px;
}

.destinations h2{
text-align:center;
margin-bottom:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#111;
border-radius:15px;
overflow:hidden;
border:1px solid #222;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card h3{
padding:15px;
text-align:center;
}

footer{
background:#0a0a0a;
text-align:center;
padding:20px;
margin-top:40px;
border-top:1px solid #222;
}

</style>
</head>

<body>

<header>
Travel With <span>Fahad</span>
</header>

<section class="hero">
<h1>Europe</h1>
</section>

<section class="content">

<h2>Discover Europe</h2>

<p>
Explore the beauty of Europe. Visit Paris, Rome,
Switzerland and Amsterdam. Enjoy historical places,
modern cities and unforgettable travel experiences.
</p>

<a href="countries.html" class="btn">Back To Countries</a>

</section>

<section class="destinations">

<h2>Top Destinations</h2>

<div class="cards">

<div class="card">
<img src="Paris.jpg.jpg">
<h3>Paris</h3>
</div>

<div class="card">
<img src="rome.jpg.jpg">
<h3>Rome</h3>
</div>

<div class="card">
<img src="switzerland.jpg.jpeg">
<h3>Switzerland</h3>
</div>

<div class="card">
<img src="amsterdam.jpg.jpeg">
<h3>Amsterdam</h3>
</div>

</div>

</section>

<footer>
© 2026 Travel With Fahad
</footer>

</body>
</html>
