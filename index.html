<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel With Fahad</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
}

header{
background:#000;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
color:white;
font-size:30px;
font-weight:bold;
}

.logo span{
color:#00aaff;
}

nav a{
color:white;
text-decoration:none;
margin:0 10px;
font-weight:bold;
}

.hero{
height:500px;
background:
linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05');
background-size:cover;
background-position:center;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
}

.hero-content h1{
font-size:55px;
margin-bottom:15px;
}

.hero-content p{
font-size:22px;
margin-bottom:20px;
}

.btn{
background:#ffcc00;
padding:15px 35px;
border-radius:30px;
color:black;
text-decoration:none;
font-weight:bold;
}

.search-box{
background:white;
width:90%;
max-width:1100px;
margin:-50px auto 40px;
padding:20px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.15);
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
}

.search-box select,
.search-box input{
padding:12px;
border:1px solid #ddd;
border-radius:8px;
}

.search-box button{
background:#00aaff;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

.section{
padding:50px 20px;
}

.section h2{
margin-bottom:20px;
text-align:center;
font-size:35px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:black;
color:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.card h3{
padding:15px;
}

.card a{
display:block;
background:#00aaff;
color:white;
text-align:center;
padding:12px;
text-decoration:none;
}

footer{
background:black;
color:white;
text-align:center;
padding:30px;
margin-top:50px;
}

</style>
</head>

<body>

<header>
<div class="logo">Fahad <span>Travel</span></div>

<nav>
<a href="#">Home</a>
<a href="#">Visa Guides</a>
<a href="#">Destinations</a>
<a href="#">Travel Costs</a>
<a href="#">Contact</a>
</nav>
</header>

<section class="hero">
<div class="hero-content">
<h1>Explore The World</h1>
<p>Visa Guidance • Travel Information • Hotels • Flights</p>
<a class="btn" href="#countries">Start Journey</a>
</div>
</section>

<div class="search-box">
<select>
<option>Select Country</option>
<option>Saudi Arabia</option>
<option>UAE</option>
<option>Turkey</option>
<option>Qatar</option>
<option>Kuwait</option>
<option>Bahrain</option>
<option>Oman</option>
</select>

<select>
<option>Visa Type</option>
<option>Visit Visa</option>
<option>Work Visa</option>
<option>Tourist Visa</option>
</select>

<input type="date">

<button>Search</button>
</div>

<section class="section" id="countries">
<h2>Popular Destinations</h2>

<div class="cards">

<div class="card">
<img src="https://images.unsplash.com/photo-1580674684081-7617fbf3d745">
<h3>Saudi Arabia</h3>
<a href="saudi.html">View Details</a>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1512453979798-5ea266f8880c">
<h3>UAE</h3>
<a href="uae.html">View Details</a>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1527838832700-5059252407fa">
<h3>Turkey</h3>
<a href="turkey.html">View Details</a>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34">
<h3>Europe</h3>
<a href="#">View Details</a>
</div>

</div>
</section>

<footer>
© 2025 Travel With Fahad
</footer>

</body>
</html>
