<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turkey - Travel With Fahad</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#050505;
color:white;
}

header{
background:#000;
padding:20px;
text-align:center;
border-bottom:1px solid #222;
}

h1 span{
color:#00c896;
}

.hero{
height:60vh;
background:
linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
url('Istanbul.jpg.jpeg');
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}

.hero h1{
font-size:60px;
}

.content{
padding:60px 20px;
max-width:1000px;
margin:auto;
}

.content h2{
color:#00c896;
margin-bottom:15px;
}

.content p{
line-height:1.8;
color:#ccc;
margin-bottom:20px;
}

.btn{
display:inline-block;
padding:12px 25px;
background:#00c896;
color:white;
text-decoration:none;
border-radius:30px;
font-weight:bold;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:40px 20px;
}

.card{
background:#111;
border-radius:15px;
overflow:hidden;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card h3{
padding:15px;
text-align:center;
}

footer{
background:#000;
padding:20px;
text-align:center;
margin-top:40px;
border-top:1px solid #222;
}

</style>
</head>

<body>

<header>
<h1>Travel With <span>Fahad</span></h1>
</header>

<section class="hero">
<h1>Turkey</h1>
</section>

<section class="content">
<h2>Discover Turkey</h2>

<p>
Turkey is famous for Istanbul, Cappadocia, Antalya and its rich history, culture and beautiful landscapes.
</p>

<a href="countries.html" class="btn">← Back to Countries</a>
</section>

<section class="cards">

<div class="card">
<img src="Istanbul.jpg.jpeg">
<h3>Istanbul</h3>
</div>

<div class="card">
<img src="Cappadocia.jpeg">
<h3>Cappadocia</h3>
</div>

<div class="card">
<img src="antalya (1).jpg">
<h3>Antalya</h3>
</div>

<div class="card">
<img src="Pamukkale.jpg.jpeg">
<h3>Pamukkale</h3>
</div>

</section>

<footer>
© 2026 Travel With Fahad
</footer>

</body>
</html>
